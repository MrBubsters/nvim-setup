# Neovim-friendly tmux settings
set -sg escape-time 10                     # no lag after pressing Esc in vim
set -g focus-events on                     # lets nvim reload files changed outside it
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,*256col*:RGB"   # true color
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1

# Ayu Dark status bar
set -g status-style "bg=#1e232b,fg=#bfbdb6"
set -g window-status-current-style "bg=#e6b450,fg=#0b0e14,bold"
set -g message-style "bg=#e6b450,fg=#0b0e14"
set -g pane-active-border-style "fg=#e6b450"
set -g pane-border-style "fg=#1e232b"
